<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#027BA5"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="20" font-weight="bold" fill="#000000">wf-single-cell (SeekOne) workflow</text>

  <!-- Column 1 (left, top -> bottom): steps 1-7 -->
  <g font-size="13">
    <rect x="30" y="44" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="62" font-weight="bold" fill="#FFFFFF">1. Input reads</text>
    <text x="50" y="76" font-size="10.5" fill="#D6EAF3">FASTQ / BAM</text>
    <line x1="250" y1="84" x2="250" y2="96" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="96" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="114" font-weight="bold" fill="#FFFFFF">2. Adapter identification &amp; stranding</text>
    <text x="50" y="128" font-size="10.5" fill="#D6EAF3">vsearch</text>
    <line x1="250" y1="136" x2="250" y2="148" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="148" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="166" font-weight="bold" fill="#FFFFFF">3. Cell barcode &amp; UMI extraction</text>
    <text x="50" y="180" font-size="10.5" fill="#D6EAF3">parasail</text>
    <line x1="250" y1="188" x2="250" y2="200" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="200" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="218" font-weight="bold" fill="#FFFFFF">4. Align reads to reference genome</text>
    <text x="50" y="232" font-size="10.5" fill="#D6EAF3">minimap2</text>
    <line x1="250" y1="240" x2="250" y2="252" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="252" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="270" font-weight="bold" fill="#FFFFFF">5. Barcode correction</text>
    <text x="50" y="284" font-size="10.5" fill="#D6EAF3">whitelist</text>
    <line x1="250" y1="292" x2="250" y2="304" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="304" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="322" font-weight="bold" fill="#FFFFFF">6. Gene &amp; transcript assignment</text>
    <text x="50" y="336" font-size="10.5" fill="#D6EAF3">stringtie2 · gffcompare</text>
    <line x1="250" y1="344" x2="250" y2="356" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="356" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="50" y="374" font-weight="bold" fill="#FFFFFF">7. UMI correction</text>
    <text x="50" y="388" font-size="10.5" fill="#D6EAF3">UMI-tools</text>
  </g>

  <!-- horizontal connector 7 -> 8 -->
  <line x1="470" y1="376" x2="530" y2="376" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2 (right, bottom -> top): steps 8-13 -->
  <g font-size="13">
    <rect x="530" y="356" width="440" height="40" rx="6" fill="#6ABCBC"/>
    <text x="550" y="374" font-weight="bold" fill="#FFFFFF">8. Make expression matrices</text>
    <text x="550" y="388" font-size="10.5" fill="#EAF5F5">MEX (gene / transcript x cell)</text>
    <line x1="750" y1="356" x2="750" y2="344" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="530" y="304" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="550" y="322" font-weight="bold" fill="#FFFFFF">9. Tag BAM files</text>
    <text x="550" y="336" font-size="10.5" fill="#D6EAF3">CB / CR / UB / UR / GN / TR tags</text>
    <line x1="750" y1="304" x2="750" y2="292" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="530" y="252" width="440" height="40" rx="6" fill="#027BA5"/>
    <text x="550" y="270" font-weight="bold" fill="#FFFFFF">10. Calculate library saturation</text>
    <text x="550" y="284" font-size="10.5" fill="#D6EAF3">median genes / UMIs per cell</text>
    <line x1="750" y1="252" x2="750" y2="240" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="530" y="200" width="440" height="40" rx="6" fill="#FFCE63" stroke="#E5A700" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="550" y="218" font-weight="bold" fill="#121212">11. SNV calling (optional)</text>
    <text x="550" y="232" font-size="10.5" fill="#5D5D5D">longshot</text>
    <line x1="750" y1="200" x2="750" y2="188" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="530" y="148" width="440" height="40" rx="6" fill="#FFCE63" stroke="#E5A700" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="550" y="166" font-weight="bold" fill="#121212">12. Fusion calling (optional)</text>
    <text x="550" y="180" font-size="10.5" fill="#5D5D5D">ctat-LR-fusion</text>
    <line x1="750" y1="148" x2="750" y2="136" stroke="#027BA5" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="530" y="96" width="440" height="40" rx="6" fill="#6ABCBC"/>
    <text x="550" y="114" font-weight="bold" fill="#FFFFFF">13. Make UMAP plots</text>
    <text x="550" y="128" font-size="10.5" fill="#EAF5F5">gene / transcript expression</text>
  </g>
</svg>
